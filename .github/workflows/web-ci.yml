name: Web CI

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/shared-types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared-types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared-types/openapi.ts is gitignored; the hand-maintained fallback in
      # index.ts keeps the build green without running the Python exporter in CI.
      - name: Typecheck
        run: pnpm --filter @sfqa/web typecheck

      - name: Lint
        run: pnpm --filter @sfqa/web lint

      - name: Build
        run: pnpm --filter @sfqa/web build
